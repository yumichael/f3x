<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Polynomial Value Explorer</title>
<style>
  :root{color-scheme:dark;--bg:#0d0f12;--panel:#15181d;--panel2:#1b1f26;--text:#e8ebef;--muted:#9aa4b2;--border:#2a313b;--accent:#8ab4ff;--danger:#ff7d7d}
  *{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit;background:#101318;border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  button{cursor:pointer;background:#202630} button:hover{background:#29313d} button.primary{background:#245ea9;border-color:#3777c8} button.danger{background:#5a2626}
  input[type="checkbox"]{accent-color:var(--accent)} input[type="range"]{padding:0}
  #app{height:100%;display:grid;grid-template-columns:330px 1fr;min-width:0}
  #sidebar{height:100%;overflow:auto;background:var(--panel);border-right:1px solid var(--border);padding:10px}
  #sidebar h1{font-size:17px;margin:2px 0 10px} .subtle{color:var(--muted)}
  details{border-top:1px solid var(--border);padding:7px 0} summary{cursor:pointer;font-weight:650;margin-bottom:7px}
  .row{display:flex;gap:6px;align-items:center;margin:5px 0}.row>*{min-width:0}.row label{flex:1}.grow{flex:1}.small{width:74px}.tiny{width:56px}.wide{width:100%}
  .seg{display:flex}.seg button{flex:1;border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg button.active{background:#315d93;border-color:#4c83c3}
  .kv{display:grid;grid-template-columns:1fr auto;gap:4px 8px}.kv div:nth-child(odd){color:var(--muted)}
  #main{position:relative;min-width:0;min-height:0;background:#050608}.viewgrid{position:absolute;inset:0;display:grid;grid-template-columns:1fr;gap:1px;background:#000}
  .pane{position:relative;overflow:hidden;background:#050608;min-width:0;min-height:0}.pane canvas{position:absolute;inset:0;width:100%;height:100%}
  #cpuCanvas,#overlayCanvas{pointer-events:none}.hidden{display:none!important}
  #hud{position:absolute;left:10px;bottom:10px;z-index:20;background:#0a0c10cc;border:1px solid #2b323d;border-radius:8px;padding:8px 10px;min-width:250px;backdrop-filter:blur(4px)}
  #progress{height:6px;background:#242a33;border-radius:99px;overflow:hidden;margin-top:5px}#progressBar{height:100%;width:0;background:#6da7ff}
  #topbar{position:absolute;right:10px;top:10px;z-index:30;display:flex;gap:6px}.pill{background:#0a0c10cc;border:1px solid #2b323d;border-radius:999px;padding:5px 9px}
  #toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:100;background:#1b212aaa;border:1px solid #394454;border-radius:8px;padding:8px 12px;display:none}
  dialog{background:#161a20;color:var(--text);border:1px solid #3a4350;border-radius:10px;max-width:560px}dialog::backdrop{background:#0009}
  .error{color:#ff9b9b}.ok{color:#9ee493}.warn{color:#ffd27d}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #comparePanel{position:absolute;inset:0 0 0 50%;background:#050608;border-left:1px solid #333;display:none;z-index:5}#comparePanel img{width:100%;height:100%;object-fit:contain}
  body.presentation #sidebar,body.presentation #topbar,body.presentation #hud{display:none} body.presentation #app{grid-template-columns:1fr}
  .note{font-size:12px;color:var(--muted);margin:4px 0}.sectiontitle{margin-top:8px;font-weight:650}
  @media(max-width:850px){#app{grid-template-columns:280px 1fr}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>Polynomial Value Explorer</h1>
    <div class="note">GPU shader evaluation uses f32; CPU high-precision mode uses JavaScript float64.</div>

    <details open>
      <summary>Polynomial</summary>
      <label>Coefficient alphabet</label>
      <input id="alphabet" class="wide mono" value="-1, 1" />
      <div class="row"><select id="alphabetPreset" class="grow"><option value="">Presets…</option><option value="-1, 1">{−1,+1}</option><option value="0, 1">{0,1}</option><option value="-1, 0, 1">{−1,0,+1}</option><option value="roots3">3rd roots of unity</option><option value="roots4">4th roots of unity</option><option value="roots5">5th roots of unity</option><option value="roots6">6th roots of unity</option><option value="roots7">7th roots of unity</option><option value="roots8">8th roots of unity</option></select><span id="alphabetStatus" class="subtle"></span></div>
      <div class="row"><label>Degree D</label><input id="degree" type="number" min="0" max="200" value="14" class="small"></div>
      <div class="seg"><button id="exactBtn" class="active">Exactly D</button><button id="upToBtn">Up to D</button></div>
      <div class="row"><label>Family size</label><span id="familyCount" class="mono">—</span></div>
      <div class="row"><label>Output transform</label><select id="transform"><option value="0">p(z)</option><option value="1">1 / p(z)</option><option value="2">log p(z)</option><option value="3">p(z) / |p(z)|</option></select></div>
      <div class="row"><label>Precision/backend</label><select id="precision"><option value="gpu">GPU f32 (shader)</option><option value="cpu">CPU f64 (high precision)</option></select></div>
    </details>

    <details open>
      <summary>Input</summary>
      <div class="row"><label>Re(z)</label><input id="zRe" type="number" step="0.001" value="0.64" class="grow"></div>
      <div class="row"><label>Im(z)</label><input id="zIm" type="number" step="0.001" value="0.36" class="grow"></div>
      <div class="row"><label><input id="renderDrag" type="checkbox"> Render while dragging</label></div>
      <div class="row"><label>Input size</label><input id="inputSize" type="range" min="3" max="24" value="8" class="grow"><input id="inputColor" type="color" value="#ffffff"></div>
      <div class="row"><label>Outline</label><input id="inputOutline" type="color" value="#000000"><label><input id="crosshair" type="checkbox" checked> Crosshair</label></div>
      <div class="row"><label>Keyboard step</label><input id="keyStep" type="number" step="0.001" value="0.01" class="small"></div>
    </details>

    <details open>
      <summary>Rendering</summary>
      <div class="row"><label>Layout</label><select id="layout"><option value="combined">Combined</option><option value="split">Split</option><option value="output">Output only</option></select></div>
      <div class="row"><label>Style</label><select id="renderStyle"><option value="points">Points</option><option value="density">Density</option></select></div>
      <div class="row"><label>Point size</label><input id="pointSize" type="range" min="1" max="10" step="0.5" value="1.5" class="grow"></div>
      <div class="row"><label>Opacity</label><input id="pointOpacity" type="range" min="0.01" max="1" step="0.01" value="0.32" class="grow"></div>
      <div class="row"><label>Point color</label><input id="pointColor" type="color" value="#8ab4ff"></div>
      <div class="row"><label>Color by</label><select id="colorMode"><option value="0">Single color</option><option value="1">Degree</option><option value="2">Leading coefficient</option><option value="3">Constant coefficient</option><option value="4">Coefficient sum angle</option><option value="5">Nonzero coefficient count</option></select></div>
      <div class="row"><label>Density tone</label><select id="tone"><option value="linear">Linear</option><option value="sqrt">Square root</option><option value="log" selected>Logarithmic</option></select></div>
      <div class="row"><label>Density exposure</label><input id="exposure" type="range" min="0.1" max="20" step="0.1" value="4" class="grow"></div>
      <div class="row"><label>Background</label><input id="bgColor" type="color" value="#050608"></div>
      <div class="row"><label>Render amount</label><select id="renderAmount"><option value="all">All</option><option value="10000">10,000</option><option value="100000">100,000</option><option value="1000000">1,000,000</option><option value="custom">Custom</option></select></div>
      <div class="row" id="customAmountRow" style="display:none"><label>Custom count</label><input id="customAmount" type="number" min="1" value="250000" class="grow"></div>
      <div class="row"><label>Random seed</label><input id="seed" type="number" value="123456789" class="grow"><button id="newSeed">New</button></div>
      <div class="row"><button id="renderBtn" class="primary grow">Render</button><button id="pauseBtn">Pause</button><button id="clearBtn">Clear</button></div>
    </details>

    <details>
      <summary>Camera / Axes</summary>
      <div class="row"><button id="fitBtn" class="grow">Fit cloud</button><button id="resetView">Reset</button></div>
      <div class="row"><label><input id="autoFit" type="checkbox" checked> Auto-fit on new render</label></div>
      <div class="row"><label><input id="lockCamera" type="checkbox"> Lock output camera</label></div>
      <div class="sectiontitle">Output / Combined axes</div>
      <div class="row"><label>+Real</label><select id="outRealDir"><option>up</option><option>right</option><option>down</option><option>left</option></select><label>+Imag</label><select id="outImagDir"></select></div>
      <div class="sectiontitle">Input axes (Split)</div>
      <div class="row"><label>+Real</label><select id="inRealDir"><option>up</option><option>right</option><option>down</option><option>left</option></select><label>+Imag</label><select id="inImagDir"></select></div>
      <div class="row"><label><input id="showAxes" type="checkbox" checked> Show axes/ticks</label></div>
    </details>

    <details open>
      <summary>Animation</summary>
      <div class="row"><label>Mode</label><select id="animMode"><option value="static">Static input</option><option value="path">Path animation</option><option value="degree">Degree sweep</option></select></div>
      <div id="pathControls" style="display:none">
        <label>z(t)</label><input id="pathExpr" class="wide mono" value="(0.72 + 0.09 cos(7 tau t)) exp(i tau t)" />
        <div id="pathError" class="error note"></div>
        <div class="row"><label>t start</label><input id="tStart" type="number" step="0.01" value="0" class="small"><label>end</label><input id="tEnd" type="number" step="0.01" value="1" class="small"></div>
        <div class="row"><label>Samples N</label><input id="pathN" type="number" min="1" max="100000" value="240" class="small"><label><input id="endpoint" type="checkbox"> Include endpoint</label></div>
        <div class="row"><label><input id="loopPath" type="checkbox" checked> Loop</label><label>FPS</label><input id="pathFps" type="number" min="1" max="120" value="30" class="small"></div>
        <div class="row"><label>Render mode</label><select id="pathRenderMode"><option value="preview">Realtime Preview</option><option value="complete">Complete Each Frame</option><option value="fixed" selected>Fixed Sample Subset</option></select></div>
        <div class="row"><label>Preview budget</label><input id="previewBudget" type="number" min="100" value="100000" class="grow"></div>
        <div class="row"><label>Fixed subset</label><input id="fixedSubset" type="number" min="1" value="250000" class="grow"></div>
        <div class="row"><label><input id="showPath" type="checkbox" checked> Show path</label><label><input id="showTrail" type="checkbox" checked> Trail</label></div>
        <div class="row"><label>Trail length</label><input id="trailLength" type="number" min="1" value="40" class="small"><label>Opacity</label><input id="trailOpacity" type="range" min="0.05" max="1" step="0.05" value="0.4" class="grow"></div>
      </div>
      <div id="degreeControls" style="display:none">
        <div class="row"><label>Max degree</label><input id="sweepMax" type="number" min="0" value="18" class="small"></div>
        <div class="row"><label>Sweep</label><select id="sweepType"><option value="current">Current degree only</option><option value="cumulative">Cumulative through degree</option></select></div>
        <div class="row"><label>FPS</label><input id="sweepFps" type="number" min="1" max="30" value="2" class="small"><label><input id="loopSweep" type="checkbox" checked> Loop</label></div>
      </div>
      <div class="row"><button id="prevFrame">◀</button><button id="playBtn" class="primary grow">Play</button><button id="nextFrame">▶</button><button id="restartAnim">↺</button></div>
    </details>

    <details>
      <summary>Export / Presentation</summary>
      <div class="row"><label>Export width</label><input id="exportW" type="number" value="1920" class="small"><label>height</label><input id="exportH" type="number" value="1080" class="small"></div>
      <div class="row"><select id="exportPreset" class="grow"><option value="">Size preset…</option><option value="1920x1080">1920×1080</option><option value="3840x2160">3840×2160</option><option value="4096x4096">4096×4096</option></select></div>
      <div class="row"><label><input id="exportAxes" type="checkbox"> Axes</label><label><input id="exportInput" type="checkbox" checked> Input point</label><label><input id="exportPath" type="checkbox" checked> Path</label></div>
      <div class="row"><label><input id="transparentExport" type="checkbox"> Transparent background</label></div>
      <div class="row"><button id="exportBtn" class="grow">Export PNG</button><button id="presentationBtn">Hide UI</button></div>
    </details>

    <details>
      <summary>Bookmarks / Compare</summary>
      <div class="row"><input id="bookmarkName" placeholder="Bookmark name" class="grow"><button id="saveBookmark">Save</button></div>
      <select id="bookmarkList" class="wide" size="4"></select>
      <div class="row"><button id="loadBookmark" class="grow">Load</button><button id="deleteBookmark">Delete</button></div>
      <div class="row"><button id="pinCompare" class="grow">Pin current view</button><button id="unpinCompare">Unpin</button></div>
      <div class="row"><label><input id="overlayCompare" type="checkbox"> Overlay pinned image</label><label>Opacity</label><input id="compareOpacity" type="range" min="0.05" max="1" step="0.05" value="0.5" class="grow"></div>
    </details>
  </aside>

  <main id="main">
    <div id="viewgrid" class="viewgrid">
      <div id="inputPane" class="pane hidden"><canvas id="inputCanvas"></canvas></div>
      <div id="outputPane" class="pane"><canvas id="glCanvas"></canvas><canvas id="cpuCanvas"></canvas><canvas id="overlayCanvas"></canvas></div>
    </div>
    <div id="comparePanel"><img id="compareImg" alt="Pinned comparison"></div>
    <div id="topbar"><span id="backendPill" class="pill">Backend: —</span><button id="quickFit" class="pill">Fit</button></div>
    <div id="hud"><div id="statusLine">Ready</div><div id="countLine" class="mono">0 / 0</div><div id="progress"><div id="progressBar"></div></div><div id="rateLine" class="subtle">—</div></div>
    <div id="toast"></div>
  </main>
</div>

<dialog id="warningDialog">
  <h3>Large render</h3>
  <div id="warningText"></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button id="warningCancel">Cancel</button><button id="warningPreview">Use preview</button><button id="warningProceed" class="primary">Render anyway</button></div>
</dialog>

<script>
'use strict';

// ---------- Utility ----------
const $ = id => document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmtInt=n=>typeof n==='bigint'?n.toLocaleString():Math.round(n).toLocaleString();
const now=()=>performance.now();
function toast(s,ms=1800){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
function gcdBig(a,b){while(b){const t=a%b;a=b;b=t}return a<0n?-a:a}
function splitmix32(x){x=(x+0x9e3779b9)>>>0;x=Math.imul(x^(x>>>16),0x21f0aaad);x=Math.imul(x^(x>>>15),0x735a2d97);return (x^(x>>>15))>>>0}
function rng32(seed){let x=seed>>>0;return()=>{x=splitmix32(x);return x/4294967296}}
function hexRgb(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]}
function hsv(h,s,v){h=((h%1)+1)%1;const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6]}

// ---------- Complex arithmetic ----------
class C{constructor(re=0,im=0){this.re=re;this.im=im}add(b){return new C(this.re+b.re,this.im+b.im)}sub(b){return new C(this.re-b.re,this.im-b.im)}mul(b){return new C(this.re*b.re-this.im*b.im,this.re*b.im+this.im*b.re)}div(b){const d=b.re*b.re+b.im*b.im;return new C((this.re*b.re+this.im*b.im)/d,(this.im*b.re-this.re*b.im)/d)}neg(){return new C(-this.re,-this.im)}abs(){return Math.hypot(this.re,this.im)}arg(){return Math.atan2(this.im,this.re)}log(){return new C(Math.log(this.abs()),this.arg())}exp(){const e=Math.exp(this.re);return new C(e*Math.cos(this.im),e*Math.sin(this.im))}pow(b){if(this.re===0&&this.im===0&&b.im===0&&b.re>0)return new C(0,0);return this.log().mul(b).exp()}conj(){return new C(this.re,-this.im)}}
const cr=x=>x instanceof C?x:new C(x,0);

// ---------- Safe math expression parser ----------
const FN=new Set(['sin','cos','tan','asin','arcsin','acos','arccos','atan','arctan','sinh','cosh','tanh','exp','log','sqrt','abs','re','im','arg','conj']);
function tokenize(s){s=s.replaceAll('π','pi').replaceAll('τ','tau').replace(/[−–—]/g,'-');const out=[];let i=0;while(i<s.length){const c=s[i];if(/\s/.test(c)){i++;continue}const m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);if(m){out.push({t:'num',v:m[0]});i+=m[0].length;continue}const id=s.slice(i).match(/^[A-Za-z_][A-Za-z0-9_]*/);if(id){out.push({t:'id',v:id[0]});i+=id[0].length;continue}if(s.startsWith('**',i)){out.push({t:'op',v:'^'});i+=2;continue}if('+-*/^(),'.includes(c)){out.push({t:c==='('? 'lp':c===')'?'rp':c===','?'comma':'op',v:c});i++;continue}throw new Error(`Unexpected character “${c}”`)}
  const imp=[];for(let j=0;j<out.length;j++){const a=out[j],b=out[j+1];imp.push(a);if(!b)continue;const left=a.t==='num'||a.t==='id'||a.t==='rp';const right=b.t==='num'||b.t==='id'||b.t==='lp';const funcCall=a.t==='id'&&FN.has(a.v)&&b.t==='lp';if(left&&right&&!funcCall)imp.push({t:'op',v:'*'});}return imp}
function compileExpr(s){const ts=tokenize(s),out=[],ops=[];let prev=null;const prec={'^':4,'u-':3,'*':2,'/':2,'+':1,'-':1},right=new Set(['^','u-']);for(let i=0;i<ts.length;i++){let tok=ts[i];if(tok.t==='num'){out.push(tok)}else if(tok.t==='id'){if(FN.has(tok.v)&&ts[i+1]?.t==='lp')ops.push({t:'fn',v:tok.v});else out.push(tok)}else if(tok.t==='op'){let op=tok.v;if((op==='-'||op==='+')&&(!prev||prev.t==='op'||prev.t==='lp'||prev.t==='comma')){if(op==='+'){prev=tok;continue}op='u-'}while(ops.length&&ops.at(-1).t==='op'&&((right.has(op)?prec[op]<prec[ops.at(-1).v]:prec[op]<=prec[ops.at(-1).v]))){out.push(ops.pop())}ops.push({t:'op',v:op})}else if(tok.t==='lp'){ops.push(tok)}else if(tok.t==='rp'){while(ops.length&&ops.at(-1).t!=='lp')out.push(ops.pop());if(!ops.length)throw new Error('Mismatched parentheses');ops.pop();if(ops.at(-1)?.t==='fn')out.push(ops.pop())}else if(tok.t==='comma'){throw new Error('Multi-argument functions are not supported')}prev=tok}while(ops.length){const q=ops.pop();if(q.t==='lp')throw new Error('Mismatched parentheses');out.push(q)}
  return vars=>{const st=[];for(const q of out){if(q.t==='num')st.push(new C(Number(q.v),0));else if(q.t==='id'){const k=q.v.toLowerCase();if(k==='i')st.push(new C(0,1));else if(k==='pi')st.push(new C(Math.PI,0));else if(k==='tau')st.push(new C(Math.PI*2,0));else if(k==='e')st.push(new C(Math.E,0));else if(q.v==='N')st.push(new C(vars.N??1,0));else if(k==='t')st.push(vars.t instanceof C?vars.t:new C(vars.t??0,0));else if(k==='k')st.push(new C(vars.k??0,0));else throw new Error(`Unknown symbol ${q.v}`)}else if(q.t==='op'){if(q.v==='u-'){st.push(st.pop().neg());continue}const b=st.pop(),a=st.pop();if(!a||!b)throw new Error('Malformed expression');st.push(q.v==='+'?a.add(b):q.v==='-'?a.sub(b):q.v==='*'?a.mul(b):q.v==='/'?a.div(b):a.pow(b))}else if(q.t==='fn'){const a=st.pop();if(!a)throw new Error('Malformed function');const z=a;switch(q.v){case'sin':st.push(new C(Math.sin(z.re)*Math.cosh(z.im),Math.cos(z.re)*Math.sinh(z.im)));break;case'cos':st.push(new C(Math.cos(z.re)*Math.cosh(z.im),-Math.sin(z.re)*Math.sinh(z.im)));break;case'tan':{const sn=new C(Math.sin(z.re)*Math.cosh(z.im),Math.cos(z.re)*Math.sinh(z.im));const cs=new C(Math.cos(z.re)*Math.cosh(z.im),-Math.sin(z.re)*Math.sinh(z.im));st.push(sn.div(cs));break}case'sinh':st.push(new C(Math.sinh(z.re)*Math.cos(z.im),Math.cosh(z.re)*Math.sin(z.im)));break;case'cosh':st.push(new C(Math.cosh(z.re)*Math.cos(z.im),Math.sinh(z.re)*Math.sin(z.im)));break;case'tanh':{const ez=z.exp(),em=z.neg().exp();st.push(ez.sub(em).div(ez.add(em)));break}case'exp':st.push(z.exp());break;case'log':st.push(z.log());break;case'sqrt':st.push(z.pow(new C(.5,0)));break;case'abs':st.push(new C(z.abs(),0));break;case're':st.push(new C(z.re,0));break;case'im':st.push(new C(z.im,0));break;case'arg':st.push(new C(z.arg(),0));break;case'conj':st.push(z.conj());break;case'asin':case'arcsin':{const iz=new C(-z.im,z.re),one=new C(1,0);const r=iz.add(one.sub(z.mul(z)).pow(new C(.5,0))).log();st.push(new C(r.im,-r.re));break}case'acos':case'arccos':{const as=compileExpr('asin(t)')({t:z});st.push(new C(Math.PI/2,0).sub(as));break}case'atan':case'arctan':{const iz=new C(-z.im,z.re),one=new C(1,0);const r=one.sub(iz).log().sub(one.add(iz).log());st.push(new C(-r.im/2,r.re/2));break}default:throw new Error('Unsupported function')}}}if(st.length!==1)throw new Error('Malformed expression');return st[0]};}
function splitTopLevelCommas(s){let d=0,start=0,a=[];for(let i=0;i<s.length;i++){if(s[i]==='(')d++;else if(s[i]===')')d--;else if(s[i]===','&&d===0){a.push(s.slice(start,i));start=i+1}}a.push(s.slice(start));return a.map(x=>x.trim()).filter(Boolean)}

let glr;try{glr=new GLRenderer($('glCanvas'))}catch(e){console.error(e)}
let renderToken=0,paused=false,renderedChunks=[],currentFamily=null,currentPerm=null,processed=0,totalTarget=0,startTime=0,lastRateTime=0,lastRateCount=0,currentSampled=false,activeBackend='cpu';
function getZ(){return new C(Number($('zRe').value)||0,Number($('zIm').value)||0)}
function setZ(z,trigger=true){$('zRe').value=Number(z.re.toFixed(12));$('zIm').value=Number(z.im.toFixed(12));drawOverlays();if(trigger&&$('animMode').value==='static')requestRender(false)}
function chooseBackend(f){const want=$('precision').value;if(want==='gpu'&&glr&&glr.canGPU(f))return 'gpu';return 'cpu'}
function clearAll(){renderToken++;processed=0;totalTarget=0;renderedChunks=[];currentFamily=null;paused=false;if(glr)glr.clear();clearCPU();updateHUD('Cleared');drawOverlays()}
function targetCount(f){const v=$('renderAmount').value;if(v==='all')return f.total;let n=v==='custom'?BigInt(Math.max(1,Number($('customAmount').value)||1)):BigInt(v);return n<f.total?n:f.total}
function warningNeeded(evalCount){return evalCount>5000000n}
function maybeWarn(evalCount,onProceed,onPreview=null){if(!warningNeeded(evalCount)){onProceed();return}$('warningText').innerHTML=`<p>This operation may be slow.</p><p><b>${fmtInt(evalCount)}</b> polynomial evaluations are requested.</p><p>The app will remain cancellable. GPU f32 is recommended for interactive exploration; fixed-subset or preview modes are recommended for animation.</p>`;$('warningDialog').showModal();$('warningProceed').onclick=()=>{$('warningDialog').close();onProceed()};$('warningCancel').onclick=()=>$('warningDialog').close();$('warningPreview').onclick=()=>{$('warningDialog').close();if(onPreview)onPreview();else{$('renderAmount').value='100000';onProceed()}}}
function requestRender(warn=true,onComplete=null){let f;try{f=makeFamily()}catch(e){toast(e.message,3000);return}const n=targetCount(f);const sampled=n<f.total;const evals=n;if(warn)return maybeWarn(evals,()=>startRender(f,n,sampled,onComplete));startRender(f,n,sampled,onComplete)}
function startRender(f,nBig,sampled,onComplete=null,idsOverride=null){renderToken++;const token=renderToken;currentFamily=f;processed=0;startTime=now();lastRateTime=startTime;lastRateCount=0;renderedChunks=[];currentSampled=sampled;paused=false;activeBackend=chooseBackend(f);$('backendPill').textContent=`Backend: ${activeBackend==='gpu'?'GPU f32 shader':'CPU f64'}`;if($('precision').value==='gpu'&&activeBackend==='cpu')toast('GPU limits exceeded; using CPU f64 fallback',2500);if(glr)glr.clear();clearCPU();totalTarget=Number(nBig<=BigInt(Number.MAX_SAFE_INTEGER)?nBig:BigInt(Number.MAX_SAFE_INTEGER));const seed=Number($('seed').value)>>>0;currentPerm=idsOverride?null:makePermuter(f.total,seed);if($('autoFit').checked&&!$('lockCamera').checked)setTimeout(()=>fitCloudPreview(f,seed),0);updateHUD(sampled?'Sampled render':'Rendering');const nTarget=nBig;let i=0n;const CHUNK=activeBackend==='gpu'?65536:6000;
  function step(){if(token!==renderToken)return;if(paused){requestAnimationFrame(step);return}const remaining=nTarget-i;if(remaining<=0n){updateHUD(sampled?'Sample complete':'Complete');if(onComplete)onComplete();return}const c=Number(remaining>BigInt(CHUNK)?BigInt(CHUNK):remaining);let ids;if(idsOverride){const start=Number(i),slice=idsOverride.slice(start,start+c);ids=activeBackend==='gpu'?(slice instanceof Uint32Array?slice:Uint32Array.from(slice,Number)):slice}else if(activeBackend==='gpu'){ids=new Uint32Array(c);for(let j=0;j<c;j++)ids[j]=currentPerm.at(Number(i)+j)}else{ids=new Array(c);if(currentPerm instanceof Permuter32){const base=Number(i);for(let j=0;j<c;j++)ids[j]=currentPerm.at(base+j)}else{for(let j=0;j<c;j++)ids[j]=currentPerm.at(i+BigInt(j))}}
    renderedChunks.push(ids);if(activeBackend==='gpu')glr.draw(ids,f,getZ(),false);else cpuDraw(ids,f,getZ(),false);i+=BigInt(c);processed+=c;updateHUD(sampled?'Sampling':'Rendering');if(activeBackend==='cpu')setTimeout(step,0);else requestAnimationFrame(step)}step()}
function redrawProcessed(){if(!currentFamily)return;if(glr)glr.clear();clearCPU();for(const ch of renderedChunks){if(activeBackend==='gpu')glr.draw(ch,currentFamily,getZ(),false);else cpuDraw(ch,currentFamily,getZ(),false)}drawOverlays()}
function updateHUD(status){$('statusLine').textContent=status+(currentSampled?' · sampled':'');const tot=typeof totalTarget==='number'?totalTarget:0;$('countLine').textContent=`${fmtInt(processed)} / ${fmtInt(tot)}`;const p=tot?processed/tot:0;$('progressBar').style.width=`${clamp(p*100,0,100)}%`;const t=now(),dt=(t-lastRateTime)/1000;if(dt>.4){const rate=(processed-lastRateCount)/dt;lastRateCount=processed;lastRateTime=t;const elapsed=(t-startTime)/1000,eta=rate>0?(tot-processed)/rate:Infinity;$('rateLine').textContent=`${rate.toLocaleString(undefined,{maximumFractionDigits:0})} values/s · ${elapsed.toFixed(1)} s${Number.isFinite(eta)&&processed<tot?` · ETA ${eta.toFixed(1)} s`:''}`}}
function fitCloudPreview(f,seed){const count=Number((f.total<50000n?f.total:50000n));if(!count)return;const perm=makePermuter(f.total,seed),z=getZ(),xs=[],ys=[];for(let j=0;j<count;j++){const id=f.total<=4294967295n?perm.at(j):perm.at(BigInt(j));const ev=evalPoly(id,f,z);const v=transformOutput(ev.v);if(v&&Number.isFinite(v.re)&&Number.isFinite(v.im)){xs.push(v.re);ys.push(v.im)}}if(xs.length<2)return;xs.sort((a,b)=>a-b);ys.sort((a,b)=>a-b);const robust=true,lo=robust?Math.floor(xs.length*.01):0,hi=robust?Math.ceil(xs.length*.99)-1:xs.length-1;const minx=xs[lo],maxx=xs[hi],miny=ys[lo],maxy=ys[hi];cams.out.center=new C((minx+maxx)/2,(miny+maxy)/2);const w=$('outputPane').clientWidth,h=$('outputPane').clientHeight;const span=Math.max(maxx-minx,maxy-miny,1e-6);cams.out.zoom=.82*Math.min(w,h)/span;redrawProcessed();}

// ---------- Animation ----------
let animPlaying=false,animFrame=0,animTimer=null,fixedIds=null,pathFn=null;
function rebuildPath(){pathPoints=[];try{pathFn=compileExpr($('pathExpr').value);$('pathError').textContent='';const N=Math.max(1,parseInt($('pathN').value)||1),a=Number($('tStart').value),b=Number($('tEnd').value),incl=$('endpoint').checked;const denom=incl?Math.max(1,N-1):N;const drawN=Math.min(N,3000);for(let j=0;j<drawN;j++){const k=Math.floor(j*N/drawN),t=N===1?a:a+(b-a)*k/denom;pathPoints.push(pathFn({t,k,N}))}drawOverlays();return true}catch(e){$('pathError').textContent=e.message;return false}}
function pathZFor(k){if(!pathFn&&!rebuildPath())return getZ();const N=Math.max(1,parseInt($('pathN').value)||1),a=Number($('tStart').value),b=Number($('tEnd').value),den=$('endpoint').checked?Math.max(1,N-1):N,t=N===1?a:a+(b-a)*k/den;return pathFn({t,k,N})}
function ensureFixedIds(f){const want=BigInt(Math.max(1,parseInt($('fixedSubset').value)||1)),n=want<f.total?want:f.total,seed=Number($('seed').value)>>>0,perm=makePermuter(f.total,seed);if(n>1000000n&&f.total>4294967295n)toast('Very large fixed subsets with huge families may use substantial memory');const len=Number(n>BigInt(Number.MAX_SAFE_INTEGER)?BigInt(Number.MAX_SAFE_INTEGER):n);if(f.total<=4294967295n){const a=new Uint32Array(len);for(let i=0;i<len;i++)a[i]=perm.at(i);return a}else{const a=new Array(len);for(let i=0;i<len;i++)a[i]=perm.at(BigInt(i));return a}}
function renderAnimationFrame(){const mode=$('animMode').value;if(mode==='path'){if(!rebuildPath())return;const N=Math.max(1,parseInt($('pathN').value)||1);animFrame=clamp(animFrame,0,N-1);const z=pathZFor(animFrame);$('zRe').value=z.re;$('zIm').value=z.im;trail.push(z);const tl=Math.max(1,parseInt($('trailLength').value)||40);if(trail.length>tl)trail.splice(0,trail.length-tl);drawOverlays();let f;try{f=makeFamily()}catch(e){toast(e.message);return}const rm=$('pathRenderMode').value;if(rm==='fixed'){if(!fixedIds)fixedIds=ensureFixedIds(f);const backend=chooseBackend(f);activeBackend=backend;currentFamily=f;renderedChunks=[fixedIds];processed=fixedIds.length;totalTarget=fixedIds.length;if(glr)glr.clear();clearCPU();if(backend==='gpu'&&fixedIds instanceof Uint32Array)glr.draw(fixedIds,f,z,false);else cpuDraw(fixedIds,f,z,false);updateHUD('Fixed subset frame')}else if(rm==='preview'){const old=$('renderAmount').value,oldC=$('customAmount').value;$('renderAmount').value='custom';$('customAmount').value=$('previewBudget').value;requestRender(false);$('renderAmount').value=old;$('customAmount').value=oldC}else{const old=$('renderAmount').value;$('renderAmount').value='all';requestRender(false,()=>{if(animPlaying)advanceFrame(1)});$('renderAmount').value=old;return}}else if(mode==='degree'){const max=Math.max(0,parseInt($('sweepMax').value)||0);animFrame=clamp(animFrame,0,max);$('degree').value=animFrame;if($('sweepType').value==='current'){$('exactBtn').classList.add('active');$('upToBtn').classList.remove('active')}else{$('upToBtn').classList.add('active');$('exactBtn').classList.remove('active')}countForUI();requestRender(false)} }
function advanceFrame(d){const mode=$('animMode').value;if(mode==='path'){const N=Math.max(1,parseInt($('pathN').value)||1);let n=animFrame+d;if(n>=N)n=$('loopPath').checked?0:N-1;if(n<0)n=$('loopPath').checked?N-1:0;animFrame=n}else if(mode==='degree'){const N=Math.max(0,parseInt($('sweepMax').value)||0)+1;let n=animFrame+d;if(n>=N)n=$('loopSweep').checked?0:N-1;if(n<0)n=$('loopSweep').checked?N-1:0;animFrame=n}renderAnimationFrame()}
function playAnimation(){animPlaying=!animPlaying;$('playBtn').textContent=animPlaying?'Pause':'Play';clearInterval(animTimer);if(!animPlaying)return;fixedIds=null;const fps=$('animMode').value==='degree'?Number($('sweepFps').value):Number($('pathFps').value);animTimer=setInterval(()=>{if($('pathRenderMode').value==='complete'&&$('animMode').value==='path')return;advanceFrame(1)},1000/Math.max(1,fps));renderAnimationFrame()}

// ---------- Export / compare / bookmarks ----------
async function compositeSnapshot(){const c=document.createElement('canvas');c.width=$('glCanvas').width;c.height=$('glCanvas').height;const x=c.getContext('2d');x.fillStyle=$('bgColor').value;x.fillRect(0,0,c.width,c.height);if(activeBackend==='gpu')x.drawImage($('glCanvas'),0,0);else x.drawImage(cpu,0,0);x.drawImage(overlay,0,0);return c}
async function exportPNG(){const W=Math.max(16,parseInt($('exportW').value)||1920),H=Math.max(16,parseInt($('exportH').value)||1080);if(W*H>50000000&&!confirm('This export is very large and may use substantial memory. Continue?'))return;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');if(!$('transparentExport').checked){ctx.fillStyle=$('bgColor').value;ctx.fillRect(0,0,W,H)}const oldCam={center:cams.out.center,zoom:cams.out.zoom},scale=Math.min(W/$('outputPane').clientWidth,H/$('outputPane').clientHeight);const ecam={center:oldCam.center,zoom:oldCam.zoom*scale};if($('exportAxes').checked)drawAxes(ctx,c,ecam,'out',1);const f=currentFamily||countForUI();if(f&&renderedChunks.length){const size=Number($('pointSize').value)*scale,alpha=Number($('pointOpacity').value);ctx.globalAlpha=alpha;for(const ch of renderedChunks)for(const id of ch){const ev=evalPoly(id,f,getZ()),v=transformOutput(ev.v);if(!v)continue;const [x,y]=complexToScreen(v,ecam,W,H,'out');if(x<0||x>W||y<0||y>H)continue;ctx.fillStyle=colorFor(ev.q,f);ctx.beginPath();ctx.arc(x,y,size/2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}if($('exportPath').checked&&$('animMode').value==='path'&&pathPoints.length){ctx.strokeStyle='#c0cad080';ctx.beginPath();pathPoints.forEach((p,j)=>{const q=complexToScreen(p,ecam,W,H,'out');j?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke()}if($('exportInput').checked&&$('layout').value==='combined'){const q=complexToScreen(getZ(),ecam,W,H,'out'),r=Number($('inputSize').value)*scale;ctx.fillStyle=$('inputColor').value;ctx.beginPath();ctx.arc(...q,r,0,Math.PI*2);ctx.fill()}const a=document.createElement('a');a.download=`polynomial-values-${Date.now()}.png`;a.href=c.toDataURL('image/png');a.click()}
function stateForBookmark(){return {alphabet:$('alphabet').value,degree:$('degree').value,upTo:$('upToBtn').classList.contains('active'),zRe:$('zRe').value,zIm:$('zIm').value,transform:$('transform').value,renderStyle:$('renderStyle').value,colorMode:$('colorMode').value,pointColor:$('pointColor').value,pointSize:$('pointSize').value,opacity:$('pointOpacity').value,layout:$('layout').value,outReal:$('outRealDir').value,outImag:$('outImagDir').value,cam:{re:cams.out.center.re,im:cams.out.center.im,zoom:cams.out.zoom}}}
function applyBookmark(s){for(const [k,id] of [['alphabet','alphabet'],['degree','degree'],['zRe','zRe'],['zIm','zIm'],['transform','transform'],['renderStyle','renderStyle'],['colorMode','colorMode'],['pointColor','pointColor'],['pointSize','pointSize'],['opacity','pointOpacity'],['layout','layout'],['outReal','outRealDir']])if(s[k]!=null)$(id).value=s[k];if(s.upTo){$('upToBtn').classList.add('active');$('exactBtn').classList.remove('active')}else{$('exactBtn').classList.add('active');$('upToBtn').classList.remove('active')}updateImagSelect($('outRealDir'),$('outImagDir'));if(s.outImag)$('outImagDir').value=s.outImag;if(s.cam)cams.out={center:new C(s.cam.re,s.cam.im),zoom:s.cam.zoom};updateLayout();countForUI();requestRender(false)}
function loadBookmarks(){const b=JSON.parse(localStorage.getItem('pveBookmarks')||'{}'),sel=$('bookmarkList');sel.innerHTML='';for(const k of Object.keys(b)){const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o)}return b}

// ---------- UI ----------
function updateLayout(){const v=$('layout').value;$('inputPane').classList.toggle('hidden',v!=='split');$('viewgrid').style.gridTemplateColumns=v==='split'?'1fr 1fr':'1fr';$('outputPane').style.gridColumn=v==='split'?'2':'1';setTimeout(resizeAll,0)}
function resizeAll(){if(glr)glr.resize();resize2d(cpu);resize2d(overlay);resize2d(inputCanvas);if(currentFamily)redrawProcessed();else{if(glr)glr.clear();clearCPU();drawOverlays()}}
function bindRestart(id){$(id).addEventListener('change',()=>{fixedIds=null;countForUI();if($('animMode').value==='static')requestRender(true)})}
$('exactBtn').onclick=()=>{$('exactBtn').classList.add('active');$('upToBtn').classList.remove('active');fixedIds=null;countForUI();requestRender(true)};$('upToBtn').onclick=()=>{$('upToBtn').classList.add('active');$('exactBtn').classList.remove('active');fixedIds=null;countForUI();requestRender(true)};
$('alphabetPreset').onchange=()=>{let v=$('alphabetPreset').value;if(v.startsWith('roots')){const n=Number(v.slice(5));v=Array.from({length:n},(_,k)=>`exp(i tau ${k}/${n})`).join(', ')}if(v){$('alphabet').value=v;fixedIds=null;countForUI();requestRender(true)}};
['alphabet','degree','transform'].forEach(bindRestart);$('precision').onchange=()=>requestRender(false);$('renderBtn').onclick=()=>requestRender(true);$('pauseBtn').onclick=()=>{paused=!paused;$('pauseBtn').textContent=paused?'Resume':'Pause'};$('clearBtn').onclick=clearAll;$('newSeed').onclick=()=>{$('seed').value=Math.floor(Math.random()*2**32);fixedIds=null;requestRender(false)};
$('renderAmount').onchange=()=>{$('customAmountRow').style.display=$('renderAmount').value==='custom'?'flex':'none'};
['pointSize','pointOpacity','pointColor','colorMode','renderStyle','tone','exposure','bgColor'].forEach(id=>$(id).addEventListener('input',redrawProcessed));
$('layout').onchange=updateLayout;$('fitBtn').onclick=$('quickFit').onclick=()=>{if(currentFamily)fitCloudPreview(currentFamily,Number($('seed').value)>>>0)};$('resetView').onclick=()=>{cams.out={center:new C(0,0),zoom:230};cams.in={center:new C(0,0),zoom:230};redrawProcessed()};
for(const [r,i] of [[$('outRealDir'),$('outImagDir')],[$('inRealDir'),$('inImagDir')]]){r.onchange=()=>{updateImagSelect(r,i);redrawProcessed()};i.onchange=redrawProcessed;updateImagSelect(r,i)}$('outRealDir').value='up';updateImagSelect($('outRealDir'),$('outImagDir'));$('outImagDir').value='right';$('inRealDir').value='up';updateImagSelect($('inRealDir'),$('inImagDir'));$('inImagDir').value='right';$('showAxes').onchange=drawOverlays;
['inputSize','inputColor','inputOutline','crosshair','showTrail','trailLength','trailOpacity','showPath'].forEach(id=>$(id).addEventListener('input',drawOverlays));
['zRe','zIm'].forEach(id=>$(id).addEventListener('change',()=>{drawOverlays();if($('animMode').value==='static')requestRender(true)}));
$('animMode').onchange=()=>{$('pathControls').style.display=$('animMode').value==='path'?'block':'none';$('degreeControls').style.display=$('animMode').value==='degree'?'block':'none';animPlaying=false;$('playBtn').textContent='Play';clearInterval(animTimer);animFrame=0;fixedIds=null;if($('animMode').value==='path')rebuildPath()};
['pathExpr','tStart','tEnd','pathN','endpoint'].forEach(id=>$(id).addEventListener('change',()=>{fixedIds=null;rebuildPath()}));$('pathRenderMode').onchange=()=>{fixedIds=null};$('playBtn').onclick=()=>{if(!animPlaying&&$('animMode').value==='path'&&$('pathRenderMode').value==='complete'){let f;try{f=makeFamily()}catch(e){toast(e.message);return}const N=BigInt(Math.max(1,parseInt($('pathN').value)||1));maybeWarn(f.total*N,playAnimation,()=>{$('pathRenderMode').value='preview';playAnimation()})}else playAnimation()};$('prevFrame').onclick=()=>advanceFrame(-1);$('nextFrame').onclick=()=>advanceFrame(1);$('restartAnim').onclick=()=>{animFrame=0;trail=[];renderAnimationFrame()};
$('exportPreset').onchange=()=>{const v=$('exportPreset').value;if(v){const [w,h]=v.split('x');$('exportW').value=w;$('exportH').value=h}};$('exportBtn').onclick=exportPNG;$('presentationBtn').onclick=()=>{document.body.classList.add('presentation');setTimeout(resizeAll,0)};
$('saveBookmark').onclick=()=>{const n=$('bookmarkName').value.trim()||`Bookmark ${new Date().toLocaleTimeString()}`,b=loadBookmarks();b[n]=stateForBookmark();localStorage.setItem('pveBookmarks',JSON.stringify(b));loadBookmarks();toast('Bookmark saved')};$('loadBookmark').onclick=()=>{const b=loadBookmarks(),n=$('bookmarkList').value;if(b[n])applyBookmark(b[n])};$('deleteBookmark').onclick=()=>{const b=loadBookmarks(),n=$('bookmarkList').value;if(n){delete b[n];localStorage.setItem('pveBookmarks',JSON.stringify(b));loadBookmarks()}};
$('pinCompare').onclick=async()=>{const c=await compositeSnapshot();$('compareImg').src=c.toDataURL();$('comparePanel').style.display='block';$('outputPane').style.width='50%';$('comparePanel').style.opacity=$('compareOpacity').value;toast('Pinned current view')};$('unpinCompare').onclick=()=>{$('comparePanel').style.display='none';$('outputPane').style.width='';$('overlayCompare').checked=false};$('overlayCompare').onchange=()=>{$('comparePanel').style.pointerEvents='none';if($('overlayCompare').checked){$('comparePanel').style.inset='0';$('comparePanel').style.background='transparent';$('comparePanel').style.border='0'}else{$('comparePanel').style.inset='0 0 0 50%';$('comparePanel').style.background='#050608';$('comparePanel').style.borderLeft='1px solid #333'}};$('compareOpacity').oninput=()=>$('comparePanel').style.opacity=$('compareOpacity').value;

// pointer interactions
function attachPaneInteraction(el,which){let mode=null,last=[0,0];el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);last=[e.offsetX,e.offsetY];const cam=which==='out'?cams.out:cams.in,layout=$('layout').value,z=getZ(),canvas=which==='out'?overlay:inputCanvas,q=complexToScreen(z,cam,canvas.clientWidth,canvas.clientHeight,which);const near=Math.hypot(e.offsetX-q[0],e.offsetY-q[1])<Number($('inputSize').value)+8;mode=((which==='in')||(which==='out'&&layout==='combined'))&&near?'z':'pan'});el.addEventListener('pointermove',e=>{if(!mode)return;const cam=which==='out'?cams.out:cams.in,dx=e.offsetX-last[0],dy=e.offsetY-last[1];last=[e.offsetX,e.offsetY];if(mode==='pan'){const d=screenDeltaToComplex(dx,dy,cam,which);cam.center=cam.center.sub(d);redrawProcessed()}else{const p=screenToComplex(e.offsetX,e.offsetY,cam,el.clientWidth,el.clientHeight,which);$('zRe').value=p.re;$('zIm').value=p.im;drawOverlays();if($('renderDrag').checked){const old=$('renderAmount').value,oc=$('customAmount').value;$('renderAmount').value='custom';$('customAmount').value=Math.min(50000,Number($('previewBudget').value)||50000);requestRender(false);$('renderAmount').value=old;$('customAmount').value=oc}}});el.addEventListener('pointerup',()=>{const was=mode;mode=null;if(was==='z'&&!$('renderDrag').checked&&$('animMode').value==='static')requestRender(true);else if(was==='z'&&$('renderDrag').checked&&$('animMode').value==='static')requestRender(true)});el.addEventListener('wheel',e=>{e.preventDefault();const cam=which==='out'?cams.out:cams.in,before=screenToComplex(e.offsetX,e.offsetY,cam,el.clientWidth,el.clientHeight,which);cam.zoom*=Math.exp(-e.deltaY*.001);cam.zoom=clamp(cam.zoom,1e-5,1e9);const after=screenToComplex(e.offsetX,e.offsetY,cam,el.clientWidth,el.clientHeight,which);cam.center=cam.center.add(before.sub(after));redrawProcessed()},{passive:false})}
attachPaneInteraction($('outputPane'),'out');attachPaneInteraction($('inputPane'),'in');
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('presentation')){document.body.classList.remove('presentation');setTimeout(resizeAll,0);return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;const map={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};if(map[e.key]){e.preventDefault();const step=Number($('keyStep').value)*(e.shiftKey?.1:e.altKey?10:1),cam=$('layout').value==='split'?cams.in:cams.out,d=screenDeltaToComplex(map[e.key][0]*step*cam.zoom,map[e.key][1]*step*cam.zoom,cam,$('layout').value==='split'?'in':'out');setZ(getZ().add(d),true)}});
window.addEventListener('resize',resizeAll);new ResizeObserver(resizeAll).observe($('main'));

// initial
loadBookmarks();updateLayout();countForUI();rebuildPath();resizeAll();setTimeout(()=>requestRender(false),80);
</script>
